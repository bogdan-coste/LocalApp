[project]
name = "app"
version = "0.1.0"
description = "DocPlus Backend - AI Document Processing"
requires-python = ">=3.10,<4.0"
dependencies = [
    # Framework and web tooling
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart>=0.0.7",
    "email-validator>=2.1.0.post1",
    "jinja2>=3.1.4",
    "httpx>=0.25.1",
    
    # Databases and ORM
    "alembic>=1.12.1",
    "psycopg[binary]>=3.1.13",
    "sqlmodel>=0.0.21",
    
    # Validation and configuration
    "pydantic>=2.0",
    "pydantic-settings>=2.2.1",
    
    # Utilities
    "tenacity>=8.2.3",
    "emails>=0.6",
    
    # Authentication and security
    "pyjwt>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    
    # Monitoring
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    
    # Image processing and OCR
    "paddlepaddle>=2.5.0",
    "paddleocr==2.6.1.3",
    "opencv-python-headless", # Critic pentru Docker/Server
    "pypdfium2>=4.0.0",
    "numpy<2.0.0" # IMPORTANTE: Păstrează această limită pentru PaddleOCR
]

[dependency-groups]
dev = [
    # Testing and code quality
    "pytest>=7.4.3",
    "mypy>=1.8.0",
    "ruff>=0.2.2",
    "pre-commit>=3.6.0",
    "coverage>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Mypy configuration
[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

# Ruff configuration (linting and formatting)
[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",    # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by ruff formatter
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

# Coverage configuration
[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.hatch.build.targets.wheel]
packages = ["app"]